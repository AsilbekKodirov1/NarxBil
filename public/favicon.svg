<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Rasmdagi boy qizil gradient foni -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7F1D1D" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dumaloq qirrali qizil fon -->
  <rect width="512" height="512" rx="128" fill="url(#redGlow)" filter="url(#shadow)" />

  <!-- 3D Delivery Box (OPTOVIK.UZ) -->
  <g transform="translate(146, 90) scale(4.6)">
    <!-- Tana (Navy) -->
    <path d="M24 6L40 14V34L24 42L8 34V14L24 6Z" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Qopqoq -->
    <path d="M24 6L40 14L24 22L8 14L24 6Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Oq lenta -->
    <path d="M24 6L24 22L32 18L32 2L24 6Z" fill="#FFFFFF" opacity="0.9" />
    <!-- Qizil strelka yorlig'i -->
    <g transform="translate(12, 19) scale(0.55)">
      <rect x="2" y="2" width="16" height="14" rx="2" fill="#FFFFFF" />
      <path d="M7 11V6M7 6L5 8M7 6L9 8" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13 11V6M13 6L11 8M13 6L15 8" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="5" y1="13" x2="15" y2="13" stroke="#DC2626" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- OPTOVIK.UZ Oq Kapsula (Pill Container) -->
  <g transform="translate(46, 320)">
    <rect width="420" height="110" rx="55" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="12" />
    <text x="50" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#1E3A8A" letter-spacing="-1">OPTOVIK</text>
    <text x="295" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#DC2626" letter-spacing="-1">.UZ</text>
  </g>
</svg>
