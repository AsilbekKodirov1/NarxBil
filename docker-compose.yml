# docker-compose.yml
# NarxBil - PostgreSQL 16 ma'lumotlar bazasi konteyneri

services:
  postgres:
    image: postgres:16-alpine
    container_name: narxbil-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-narxbil_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narxbil_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-narxbil_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-narxbil_user} -d ${POSTGRES_DB:-narxbil_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

